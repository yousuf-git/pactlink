<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Icons: "P." short mark. iOS ignores SVG, so the PNG is not optional. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F2F0EB" />
    <meta name="apple-mobile-web-app-title" content="PactLink" />

    <title>PactLink | Quote to signed deposit in one link</title>
    <meta
      name="description"
      content="PactLink turns an estimate into a signed agreement and a paid deposit through one shareable link. Built for contractors, agencies, photographers and consultants."
    />
    <link rel="canonical" href="https://pactlink.app/" />
    <meta name="author" content="Muhammad Yousuf" />
    <link rel="author" href="https://yousuf-dev.com" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PactLink" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://pactlink.app/" />
    <meta property="og:title" content="PactLink | Quote to signed deposit in one link" />
    <meta
      property="og:description"
      content="Line items, e-signature, and a Stripe deposit in a single client link. Webhook-first, so the money is handled correctly."
    />
    <meta property="og:image" content="https://pactlink.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The PactLink hero: a quote card showing a captured $2,970 deposit beside the headline From estimate to paid deposit."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PactLink | Quote to signed deposit in one link" />
    <meta
      name="twitter:description"
      content="Collapse Docs + DocuSign + Stripe invoice into one approval link."
    />
    <meta name="twitter:image" content="https://pactlink.app/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="The PactLink hero: a quote card showing a captured $2,970 deposit beside the headline From estimate to paid deposit."
    />

    <!-- Fonts: Bricolage Grotesque (logo/headline) + Fraunces (display) + Inter (body) + JetBrains Mono (money/ids) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
